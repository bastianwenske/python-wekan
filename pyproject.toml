[project]
    name = 'python-wekan'
    version = "0.3.2"
    description = "This is a python client for interacting with the WeKan® REST-API"
    readme = "README.md"
    license = "BSD-3-Clause"
    # Change the version for the tools below too when bumping up
    requires-python = ">=3.9"
    classifiers = [
        "Programming Language :: Python :: 3",
        "Typing :: Typed",
    ]
    authors = [
      {name = "Bastian Wenske"},
    ]
    keywords = ["python"]
    dependencies = [
        "certifi>=2024.7.4",
        "charset-normalizer>=3.3.2",
        "idna>=3.7",
        "python-dateutil>=2.9.0.post0",
        "requests>=2.32.4",
        "six>=1.16.0",
        "urllib3>=2.6.3",
    ]

[project.optional-dependencies]
    dev = [
        "coverage[toml]>=7.5.1",
        "faker>=25.2.0",
        "iniconfig>=2.0.0",
        "packaging>=24.0",
        "pluggy>=1.5.0",
        "pytest>=8.2.0",
        "pytest-cov>=5.0.0",
        "pytest-cover>=3.0.0",
        "pytest-coverage>=0.0",
        "python-dateutil>=2.9.0.post0",
        "six>=1.16.0",
        "unittest-xml-reporting>=3.2.0",
    ]

[project.urls]
    homepage = 'https://github.com/bastianwenske/python-wekan'

[build-system]
    requires = ["setuptools>=75.3", "setuptools_scm"]
    build-backend = "setuptools.build_meta"

[tool.setuptools]
    packages = [
        "tests",
        "wekan",
    ]

[tool.pyright]
    pythonVersion = "3.9"

#    long_description_content_type="text/markdown",
